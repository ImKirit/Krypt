[package]
name = "krypt"
description = "Krypt desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "krypt_desktop"
# Phones need staticlib and cdylib as well; added when the mobile builds start.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
krypt-core = { version = "0.1.0", path = "../../../crates/krypt-core" }
krypt-store = { version = "0.1.0", path = "../../../crates/krypt-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = "1.9.0"

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.1"
# Already part of the build through Tauri; only the session query is used directly.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RemoteDesktop"] }

[dev-dependencies]
tempfile = "3.27.0"
