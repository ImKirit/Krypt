[package]
name = "krypt-core"
description = "Crypto, data model and TOTP for Krypt. No platform, file system or UI code."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# zeroize wipes Argon2's working memory after each derivation.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base32 = "0.5.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.20"
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
