[package]
name = "krypt-import"
description = "Reads exports of browsers and other password managers into Krypt services and entries."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
csv = "1.4.0"
krypt-core = { version = "0.1.0", path = "../krypt-core" }
psl = "2.1.232"
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = "1.9.0"
