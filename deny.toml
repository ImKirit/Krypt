# cargo deny check
# Advisories come from the RustSec database, licenses must be permissive, crates only from crates.io.

[advisories]
yanked = "deny"
# Unmaintained crates deep inside Tauri's dependency tree cannot be swapped out from here.
# Direct dependencies of Krypt's own crates still fail the check.
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# Unmodified dependencies the list above does not cover. MPL-2.0 only asks that changes to
# those files stay open; BSL-1.0 is permissive. Named one by one, so nothing new slips through.
exceptions = [
    # Tauri: CSS selector parsing in tauri-utils, and dirs.
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # Clipboard access on Windows.
    { allow = ["BSL-1.0"], crate = "clipboard-win" },
    { allow = ["BSL-1.0"], crate = "error-code" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
